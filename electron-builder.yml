appId: com.fluye.desktop
productName: Fluye
electronVersion: 44.4.5

directories:
  output: ../release-package
  buildResources: ../build

electronDist: ../node_modules/electron/dist
npmRebuild: false
asar: true

publish:
  provider: github
  owner: rutigliano1988
  repo: fluye
  releaseType: release

files:
  - out/**/*
  - package.json

win:
  icon: ../build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Fluye-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fluye
  runAfterFinish: true
