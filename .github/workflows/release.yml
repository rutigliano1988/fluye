name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar Electron para Windows
        run: node scripts/ensure-electron.cjs

      - name: Verificar versión de la etiqueta
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "La etiqueta $env:GITHUB_REF_NAME no coincide con package.json ($packageVersion)."
          }

      - name: Compilar instalador
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publicar archivos en GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tag = "v$packageVersion"
          $assets = @(
            "release-package/Fluye-Setup-$packageVersion.exe",
            "release-package/Fluye-Setup-$packageVersion.exe.blockmap",
            "release-package/latest.yml"
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "No se generó el archivo requerido: $asset"
            }
          }

          gh release view $tag --repo rutigliano1988/fluye *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo rutigliano1988/fluye
          } else {
            gh release create $tag @assets --title $packageVersion --generate-notes --repo rutigliano1988/fluye
          }

          if ($LASTEXITCODE -ne 0) {
            throw "No se pudieron publicar los archivos de la versión $packageVersion."
          }
